groups:
  - name: house-predictor
    rules:
      - alert: HousePredictorDown
        expr: up{job="house-predictor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "House Predictor instance {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 2 minutes."

      - alert: HousePredictorHighErrorRate
        expr: |
          sum(rate(house_predictor_prediction_errors_total[5m]))
            /
          (sum(rate(house_predictor_predictions_total[5m])) + sum(rate(house_predictor_prediction_errors_total[5m])))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of predictions are failing"
          description: "Prediction error ratio over the last 5 minutes is {{ $value | humanizePercentage }}."

      - alert: HousePredictorHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(house_predictor_prediction_latency_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 prediction latency is above 500ms"
          description: "p95 model.predict() latency is {{ $value | humanizeDuration }}."
